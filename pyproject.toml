[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroroute"
version = "0.1.0"
description = "GPU research implementation of spatial missingness-conditioned EEG experts"
requires-python = ">=3.11,<3.13"
dependencies = ["torch==2.11.0", "numpy>=1.26,<3", "scipy>=1.12,<2", "mne>=1.6,<2", "matplotlib>=3.8,<4"]

[project.scripts]
neuroroute = "neuroroute.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"neuroroute.vendor" = ["LICENSE", "UPSTREAM.json"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["src/neuroroute/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B023"]
